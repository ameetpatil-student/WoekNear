<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Employer Dashboard</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { color: var(--primary-color); margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }

        h3 { font-size: 1.1rem; margin-top: 25px; color: #475569; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; font-weight: 600; margin-bottom: 8px; }

        input[type="text"], input[type="number"], input[type="email"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea { height: 120px; resize: vertical; }

        .row { display: flex; gap: 20px; }
        .row > div { flex: 1; }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover { background-color: #1d4ed8; }

        @media (max-width: 600px) { .row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body> 
{% csrf_token %}

<div class="container">
    <h2>Post a New Job Advertisement</h2>
    <form action="/submit-job" method="POST">

        <h3>1. The Basics</h3>
        <div class="form-group">
            <label for="job-title">Job Title</label>
            <input type="text" id="job-title" name="job_title" placeholder="e.g. Senior Product Designer" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g. New York or Remote" required>
            </div>
            <div class="form-group">
                <label for="job-type">Employment Type</label>
                <select id="job-type" name="job_type">
                    <option value="full-time">Full-time</option>
                    <option value="part-time">Part-time</option>
                    <option value="contract">Contract</option>
                    <option value="internship">Internship</option>
                </select>
            </div>
        </div>

        <h3>2. Role & Requirements</h3>
        <div class="form-group">
            <label for="description">Job Summary & Responsibilities</label>
            <textarea id="description" name="description" placeholder="Describe the daily tasks and mission of this role..." required></textarea>
        </div>

        <div class="form-group">
            <label for="requirements">Qualifications (Hard & Soft Skills)</label>
            <textarea id="requirements" name="requirements" placeholder="List required skills, years of experience, etc."></textarea>
        </div>

        <h3>3. Compensation & Perks</h3>
        <div class="row">
            <div class="form-group">
                <label for="salary">Salary Range (Optional)</label>
                <input type="text" id="salary" name="salary" placeholder="e.g. $80k - $100k">
            </div>
            <div class="form-group">
                <label for="deadline">Application Deadline</label>
                <input type="date" id="deadline" name="deadline">
            </div>
        </div>

        <div class="form-group">
            <label for="benefits">Benefits & Perks</label>
            <input type="text" id="benefits" name="benefits" placeholder="e.g. Health Insurance, Flexible Hours, Gym">
        </div>

        <button type="submit" class="btn-submit">Publish Job Post</button>
    </form>
</div>

</body>
</html>
