<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | WorkNear</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --text-muted: #64748b; }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; }
        
        .main-wrapper { display: flex; height: 100vh; width: 100vw; }

        .info-panel { flex: 1; background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; padding: 80px; }
        .info-panel h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; line-height: 1.1; }
        
        .form-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .form-box { width: 100%; max-width: 400px; }
        h2 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }

        .input-group { margin-bottom: 20px; }
        label { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #eef2f6; border-radius: 12px; outline: none; font-family: inherit; transition: 0.2s; }
        input:focus { border-color: #000; }

        .btn-reg { width: 100%; padding: 16px; background: #000; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.3s; }
        .btn-reg:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Alert Messages */
        .alert-message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; font-weight: 600; text-align: center; }
        .alert-message.error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
        .alert-message.success { background-color: #dcfce3; color: #166534; border: 1px solid #86efac; }

        @media (max-width: 900px) { .info-panel { display: none; } }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="info-panel">
            <h1>Secure your<br>account.</h1>
            <p style="opacity: 0.7; line-height: 1.6; max-width: 350px;">
                Enter a strong new password below to regain access to your WorkNear profile.
            </p>
        </div>
        <div class="form-panel">
            <div class="form-box">
                <h2>Create New Password</h2>
                <p style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.5;">
                    Please enter and confirm your new password.
                </p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'reset_password1' %}" autocomplete="off">
                    {% csrf_token %}
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" name="new_password" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" name="confirm_password" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                    
                    <button type="submit" class="btn-reg">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
